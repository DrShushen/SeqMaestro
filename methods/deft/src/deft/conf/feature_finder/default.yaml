_target_: deft.features.feature_finder.LLMFeatureFinder
parsing_module_name: deft.utils.parsing
type_engine: old
# Seeds the in-context examples shown in every prompt. Without this the examples changed on
# every call, so two runs with the same `random_state` were not comparable -- which matters
# because the pilot's stability axis is meant to measure variation in the *method*, not in
# unpinned plumbing.
random_state: ${oc.select:random_state,42}
