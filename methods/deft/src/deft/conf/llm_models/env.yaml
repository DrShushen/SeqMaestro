# Fully env-driven model config, for a backend that is chosen at run time.
#
# `DEFT_LLM_MODEL` must be a LiteLLM model string including its provider prefix, e.g.
# `azure/my-deployment` or `openai/gpt-4o-mini`.
model: ${oc.env:DEFT_LLM_MODEL}
base_model: ${oc.env:DEFT_LLM_BASE_MODEL,null}
api_base: ${oc.env:DEFT_LLM_API_BASE,null}
api_version: ${oc.env:DEFT_LLM_API_VERSION,null}
api_key: ${oc.env:DEFT_API_KEY}
