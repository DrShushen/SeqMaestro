# What every dataset's run has in common. It cannot run on its own, because it names no dataset.
# Each dataset config `extends` it and states only what belongs to that dataset: `null` removes an
# arm, and any key written again replaces the value here.

grid:
  # Five seeds, because stability is a mean over seed *pairs*: five seeds give ten pairs where three
  # would give three, and the permuted null is estimated from as many draws as there are seeds. With
  # three seeds both would be too thin.
  seeds: [42, 43, 44, 45, 46]
  # Both label conditions: the labels as they are, and the training labels shuffled, which are the
  # control that every number is compared with.
  labels: [real, permuted]
  # The share of the training rows each seed fits on, drawn anew per seed and kept in the target's
  # proportions. Most models here give the same fit on the same rows, so the draw is what makes two
  # seeds differ, and the stability of an arm is measured across it. Every arm and the baseline
  # fit on the same rows at a seed.
  train_fraction: 0.8
  # Bootstrap draws behind each interval, the same count for every dataset so that their intervals
  # are comparable. Each draw scores every row of the split again, so the time a larger count takes
  # grows with the rows, whereas the ends of a percentile interval move little past a few hundred
  # draws.
  n_bootstrap: 200
  # How many independent nulls the run has. `seed` shares one shuffled label vector across every
  # arm of a seed, so the null's level rests on as many draws as there are seeds, and a draw that
  # falls above chance does so in every arm at once. `cell` draws per arm, giving one null per cell,
  # so the level can be averaged and quoted with an interval. How far one draw falls from chance
  # grows with how much of the signal one feature holds: a model fitted to shuffled labels still
  # picks a direction, which can fall along that feature with either sign. On such data the null
  # needs every seed here, or `cell` where it has to be quoted with an interval
  # (seqmaestro/report/components/10_evaluation.binary.md).
  permutation_scope: seed
  # Applies to every arm, including the two tree arms. Core and DEFT both resolve `balanced` to
  # scikit-learn's `n_samples / (n_classes * count)`, which makes the arms comparable on a dataset
  # whose positive rate is far from a half. On a balanced dataset the weights are 1.0 and this is a
  # no-op, so the same setting suits every dataset.
  class_weight: balanced
  # Shuffles per feature for the permutation importance, which is measured the same way for every
  # arm, so it is the number to use when arms are compared with each other. Each repeat is one
  # prediction pass per feature, so its running time grows with the width of the pool. 0 skips it,
  # and a run made without it can only gain it by being run again.
  #
  # Off, because **nothing uses this column**: every analysis takes its top-N by the model's own
  # importance, and neither the reduction, the panel, the judge nor the report uses it. Set it above
  # 0 when something does. See docs/developer/feature_record.md.
  permutation_repeats: 0
  # Whether the judge runs (docs/developer/analyses/judge.md). It asks a language model to rate the
  # most important features of each cell, several times each (`analyses`, below), so its calls grow
  # with the arms and the seeds. It is off because nothing after Stage 2 depends on its scores, and
  # `judge: true` in a dataset's config turns it on.
  judge: false
  # Whether the judge, when it runs, is told which class each feature goes with. It is shown the
  # sign of the marginal effect and never its size, so the permuted-label controls stay
  # indistinguishable from the real features. This sharpens the question from "is this feature
  # plausible" to "is this claim plausible", which is a different question, so judge scores from a
  # run with this on cannot be compared with scores from a run with it off.
  judge_direction: true
  # How the arms that run a language model's code treat a feature it wrote that fails on the rows.
  # Stated once here, so that every such arm writes features under one policy.
  generated_features:
    # Times a round's failed candidates (raised, too slow, wrong shape, too often undefined,
    # constant) go back to the model with their failures. One more call can recover a feature whose
    # code missed a case, such as a short sequence. 0 sends nothing back.
    repair_rounds: 1
    # A feature undefined (NaN) on up to this share of rows is kept and filled with its median.
    # Above it, the feature mostly says which rows it cannot measure, and is dropped.
    max_undefined_share: 0.2
    # The longest, in whole seconds, one feature may run on the rows it is checked on. A feature
    # whose running time grows with the square or cube of a sequence's length finishes in seconds
    # on a few hundred bases and runs for days on several thousand, holding up its whole arm. Past
    # this limit it has failed like any other, and on more rows it is given proportionally longer.
    # IGSR takes the same limit for each term on each split, whereas DEFT stops a feature after 60
    # seconds, a limit fixed in its code.
    max_seconds: 60
    # Characters of one sequence an example in a prompt shows. A longer sequence is shown by its two
    # ends.
    max_example_length: 300
    # What the person running the analysis asks of the form of the features, as text, such as
    # "Write each feature as a ratio or a difference of two counts". Every arm that writes features
    # is shown it word for word. None by default: the models write whatever forms the task and the
    # rows suggest to them. The agent asks the user before Stage 2 whether to give guidance
    # (process/task-construction.md), and a dataset's config states the answer.
    guidance: null

# How every call to the language model is made: by the proposer, the judge, the recurrence
# analysis, DEFT's generative finder and IGSR alike. Which provider and model are called is not a
# setting of a config: `.env` names them, with their credentials (.env.example), and each part of
# the run records the model it called and how.
language_model:
  # What a call asks of a model that reasons, where the provider takes an effort (Azure OpenAI, the
  # OpenAI API, and a current Claude model, which thinks adaptively). A model's reasoning counts
  # against the tokens its reply may take, so a low effort leaves them for the answer. An older
  # Claude model is called with its extended thinking off, and a model on Azure AI Foundry with its
  # reasoning off, whatever this says (seqmaestro/llm/client.py).
  reasoning_effort: minimal
  # Times a call that failed for a reason that may pass, such as a rate limit or a timeout, is made
  # again. 0 makes each call once.
  retries: 5
  # Seconds a reply is waited for. The recurrence analysis waits longer for a grouping of many
  # features, as long as such a reply needs.
  timeout_seconds: 120

# How the Stage 2 analyses use the run's cells. Each setting decides what a table of the run holds,
# so these are settings of the run, and an analysis started by hand takes them from the run's
# recorded config as the driver's does.
analyses:
  # The features of a cell an analysis takes: its most important, by the model's importance.
  # Models differ by orders of magnitude in how many features they use, and a comparison of a
  # 400-feature set with a 15-feature one measures their sizes, so every analysis takes the same
  # number from each cell.
  top_n: 20
  # The judge, where `grid.judge` has it run.
  judge:
    # Independent ratings of each feature. Their spread says how repeatable a rating is.
    repeats: 3
    # Whether the judge is shown each feature's code beside its description.
    show_code: false
    # The label conditions whose features are rated. A language-model proposer writes much the
    # same features on shuffled labels, so rating those would rate the same features twice
    # (docs/developer/analyses/judge.md).
    labels: [real]
    # The share of the panel that must get a rating. Below it the judge's stage fails.
    min_answered: 0.9
    # Seeds the order the panel is presented in.
    seed: 0
  # The recurrence analysis (docs/developer/analyses/recurrence.md).
  recurrence:
    # The kinds of feature grouped: those a language model wrote. A positional split is drawn from
    # an enumeration, so its recurrence is arithmetic.
    kinds: [llm_generated]
    # The size of group the grouping request asks for, the same for both label conditions.
    items_per_group: 6
    # Permutations behind the recurrence null.
    draws: 2000
    # Whether every arm's features are also grouped together in one pass, which is what shows that
    # two arms reached one idea.
    across_arms: true
    # Seeds the order the features are listed in, and the null.
    seed: 0

# How each source the pools below hold is computed, stated once for the run. A source no pool holds
# is not set: a config that extends this one and drops every pool holding one sets it to null.
# `llm_generated` stays while a pool holds `llm_generated_iterative`, which writes with its settings.
sources:
  kmer:
    # The shortest and the longest k-mers counted, both included: every k-mer of 1 to 6 bases.
    k_range: [1, 6]
    # Counts as they are. `per_length` divides each by the k-mer positions in its sequence, so that
    # a count does not grow with the sequence's length (docs/developer/dataset.md).
    normalise: counts
  llm_generated:
    # Calls per proposal, each told the names proposed before it; features asked for per call; and
    # labelled rows shown. The iterative source writes with the same settings. Each arm, label
    # condition and seed has its own proposal, so two arms never share one.
    proposal_rounds: 3
    n_per_round: 10
    n_examples: 20
  llm_generated_iterative:
    # Rounds after the blind first one, each shown a fit of the arm's model: five rounds in all.
    # Each further round is one more proposal, of `proposal_rounds` requests, and one more fit of
    # the arm's model in every cell.
    feedback_rounds: 4

# The settings a run changes for its models. A Core model takes the few its class lists (`settings`,
# in seqmaestro/models/), such as `xgboost: {n_estimators: 500}`, and is otherwise fitted with its
# defaults, which the dry run prints. DEFT and IGSR take overrides of their methods'
# configurations, passed verbatim.
models:
  deft_or_cart:
    # The DEFT paper uses 20 reflections and 20 samples per prompt, which takes an order of
    # magnitude more tokens per node. Reflection is part of the method and not overhead, so it is
    # reduced here and not removed. Each run records the per-node cost at these settings. CART
    # calls no language model and ignores them. Which language model DEFT calls is not a setting
    # of a config: it is the one the environment names for the whole run (.env.example).
    config_overrides:
      - params_generation.n_reflections=5
      - params_generation.n_samples_per_prompt=10

# Each pool with the models fitted on it. An arm is one model on one pool, and the driver offers
# the arms the machine in the order written here, so the cheap ones are listed first. `l1` is
# l1_logistic for a binary target and l1_linear for a continuous one. Every arm is reduced and
# profiled unless its entry leaves it out with a reason, `not_reduced: {model: reason}` or
# `not_profiled: {model: reason}`. XGBoost is a black box, which the panel leaves out by itself.
arms:
  positional:
    # `pysr` is one equation found by PySR's symbolic search (`seqmaestro/models/symbolic.py`),
    # whose search runs in SeqMaestro_Method_pysr. A search's running time depends on the rows and
    # the iterations far more than on the columns, so it takes the positional pool as every model
    # does. `deft_or_cart` here is CART: DEFT's tree over its naive candidates, with no language
    # model.
    models: [l1, ebm, xgboost, pysr, deft_or_cart]
  llm_generated:
    # Every model that can take a proposal, so that the pools can be compared under the same four
    # models as `positional`.
    models: [l1, ebm, xgboost, pysr]
  llm_generated_iterative:
    # The same proposer, shown each round what a fit of the arm's model made of the features so far.
    # `l1` reports the sign of every weight, which is the feedback a proposer can act on most
    # directly: "this counts against the outcome" is a different instruction from "this is unused".
    # `pysr` shows the proposer its equation, and each of its informed rounds is one more search.
    # A pool with a vocabulary beside the proposal, such as `kmer+llm_generated_iterative`, shows
    # each informed round which of those columns the fit relied on too (`ProposerArm`, in
    # seqmaestro/pipeline/stage2.py).
    models: [l1, ebm, xgboost, pysr]
  positional+llm_generated_joint:
    # DEFT: the same tree as CART above, with a language model writing candidates at each node.
    models: [deft_or_cart]
  positional+kmer:
    # EBM is left out because it boosts round-robin over columns, so its running time grows with
    # the width of a k-mer vocabulary. PySR is left out because among thousands of k-mer counts a
    # search has little chance of finding the ones that matter. Either may be added, and the time
    # estimate says how long it would take on the dataset at hand.
    models: [l1, xgboost]

# Stage 3A: every arm reduced to a model of this many features, at its best validation seed, except
# those an entry of `arms` lists under `not_reduced`. See docs/developer/reduction.md.
reduction:
  n_features: 10

# Stage 3B: the reliability panel of every reduced arm whose model can be interpreted feature by
# feature, except those an entry of `arms` lists under `not_profiled`. See
# docs/developer/reliability.md.
reliability:
  # Complementary pairs behind Tier 1: 2B selections per arm, where B is this number. The bound
  # holds at any B, so a run with a slow arm may set fewer pairs, for every arm, and each arm's
  # record states the number.
  pairs: 50
  # Label permutations behind Tier 2. The smallest p-value is 1/(permutations + 1), and calling
  # the single most associated of p features at BH q needs it below q/p: 100,000 reaches that for
  # pools of up to 5,000 candidates at q = 0.05.
  permutations: 100000
  # Every pair inside a cluster agrees at least this much, in absolute Spearman correlation.
  cluster_rho: 0.8
  # Drop a candidate whose commonest value covers more than this share of train + val.
  max_modal_share: 0.99
  # The planted-signal check: this many real columns, a linear predictor of this spread.
  planted_count: 5
  planted_signal_sd: 1.5
  # The arm on which Tier 1's global-null and planted-signal reruns are made: the whole positional
  # vocabulary as its pool, large and heavily correlated, and cheap to fit.
  check_arm: l1/positional
  # The base of every random stream the panel draws.
  seed: 0
