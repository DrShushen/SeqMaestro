# The example dataset in a few minutes, with no language model: every stage of a run, from the
# baseline to the report's figures, on fewer arms, two seeds and a small panel. It is the way to
# see what a run leaves behind, or to check an installation, before the full run of example.yaml.
#
# It extends that config and states only what it cuts, which is also how a dataset's config drops
# an arm or changes a setting of the shared grid (README.md, "Sharing, via `extends`").
extends: example.yaml
name: example_quick

grid:
  # Two seeds are the fewest a run can have, since stability is measured across seeds.
  seeds: [42, 43]

# No pool below holds a written source, so no source's settings are stated for one.
sources:
  llm_generated: null
  llm_generated_iterative: null

arms:
  positional:
    # Without `pysr`, whose search takes minutes per fit and whose panel takes hours.
    models: [l1, ebm, xgboost, deft_or_cart]
  llm_generated: null
  llm_generated_iterative: null
  positional+llm_generated_joint: null

reliability:
  # A fifth of the shared panel's selections, and far fewer permutations than a p-value worth
  # quoting needs: enough to see each tier's files, and too few to rest a claim on.
  pairs: 10
  permutations: 2000
