# What every dataset with a continuous target has in common. It extends `_shared.yaml` and states
# only what the kind of target changes, so wherever the two kinds agree they share one setting.
# It cannot run on its own, because it names no dataset.
extends: _shared.yaml

grid:
  # A continuous target has no classes to weight. Per-row weights from a dataset's design are still
  # used, as for every kind.
  class_weight: null

# `l1` in `_shared.yaml`'s arms is l1_linear here, the sparse linear model fitted by least squares.
# EBM and XGBoost fit the continuous target with their regressors. XGBoost's regressor decides when
# to stop adding trees on a part of its fitting rows set aside for that
# (`seqmaestro/models/boosting.py`), since a fixed number of trees fits a heavy tail's noise.
# `pysr` fits its equation under squared error, as it fits the log-odds under the logistic loss for
# a binary target. DEFT grows a regression tree, by variance reduction, with prompts written for a
# continuous target.
models:
  igsr:
    # Influence-guided symbolic regression: a linear model over terms a language model writes as
    # functions of the whole sequence (and of the covariates, where the arm's pool holds them), each
    # kept by its influence, the rise in validation error without it. The grid's
    # `generated_features` is its policy for what the model writes, which the arm's stage passes to
    # IGSR as config overrides, with the language model the environment names for the whole run.
    # These are IGSR's settings.
    config_overrides:
      # The paper's IGSR: terms pruned by influence alone, with no second model call.
      - experiment.algorithmic_pruning=true
      # Terms kept at each pruning: the reduction's budget, so the search arrives at a model of the
      # size Stage 3A reduces every arm to.
      - experiment.keep_n_terms=10
      # The tree search's budget, reduced from the paper's 30 expansions and 5 successors per node,
      # as DEFT's reflections are reduced from its paper's. Each expansion adds one node, and when
      # the search first reaches a node its agent runs once for each successor, each run making one
      # to three calls, so a cell makes 12 to 54 calls at these settings, more where a run fails and
      # is made again (seqmaestro/pipeline/calls.py counts them).
      - experiment.total_budget=10
      - experiment.n_successors=3

arms:
  # IGSR fits a continuous target only, so it is an arm here and not in `_shared.yaml`.
  llm_generated_joint:
    models: [igsr]
